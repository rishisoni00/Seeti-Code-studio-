<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeti - Code Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--accent:#8b5cf6;--border:rgba(255,255,255,.15);--bg:#0f0f14}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.4);backdrop-filter:blur(10px)}
.glass-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
#editor{height:calc(100vh - 56px)}
.CodeMirror{height:100% !important;background:#111 !important}
#aiPanel{position:fixed;right:12px;top:70px;bottom:12px;width:360px;z-index:999;background:rgba(18,18,28,.98);border:1px solid var(--border);border-radius:20px;transform:translateX(120%);transition:.35s;display:flex;flex-direction:column;padding:16px;backdrop-filter:blur(20px)}
#aiPanel.open{transform:translateX(0) !important}
#aiResponse{flex:1;overflow:auto;margin-top:12px;padding:10px;background:rgba(0,0,0,.4);border-radius:12px;font-size:12px;white-space:pre-wrap;border:1px solid var(--border)}
</style>
</head>
<body>

<div class="top">
  <b>Seeti Editor</b>
  <div style="display:flex;gap:8px">
    <button class="glass-btn" style="background:linear-gradient(135deg,#f59e0b,#ec4899);color:#fff;font-weight:800" onclick="openAI()">✨ Seeti AI</button>
    <button class="glass-btn" onclick="run()">▶ Run</button>
  </div>
</div>

<div id="editor"></div>

<div id="aiPanel">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 style="margin:0">✨ Seeti AI</h3>
    <button class="glass-btn" onclick="openAI()">✕</button>
  </div>
  <textarea id="aiPrompt" placeholder="Ex: Make a login page with glassmorphism, calculator, portfolio..." style="width:100%;height:80px;margin:12px 0;padding:12px;border-radius:12px;background:rgba(0,0,0,.4);color:#fff;border:1px solid var(--border);resize:none;box-sizing:border-box"></textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="glass-btn" onclick="askAI('make')">🎨 Generate</button>
    <button class="glass-btn" onclick="askAI('fix')">🐛 Fix Code</button>
    <button class="glass-btn" onclick="askAI('explain')">📖 Explain</button>
  </div>
  <div id="aiResponse">AI yaha jawab dega...</div>
  <button class="glass-btn" style="margin-top:8px;background:var(--accent);font-weight:700" onclick="applyAICode()">⬇️ Apply to Editor</button>
</div>

<script>
let cm = CodeMirror(document.getElementById('editor'), {mode:'htmlmixed', theme:'default', lineNumbers:true, value:'<h1>Hello Seeti</h1>'});
let lastAIResult = "";

function run(){ /* tumhara run function */ }
function openAI(){ document.getElementById('aiPanel').classList.toggle('open'); }

async function askAI(mode){
  let prompt = document.getElementById('aiPrompt').value.trim();
  let code = cm.getValue();
  let q = mode==='fix' ? `Fix this code, return ONLY fixed code:\n${code}\nUser says: ${prompt}` : mode==='explain' ? `Explain in Hindi+English:\n${code}` : `Create full HTML CSS JS code for: ${prompt}. Return ONLY code.`;
  
  if(!prompt && mode!=='explain'){ alert("Pehle prompt likho!"); return; }
  document.getElementById('aiResponse').textContent = "⏳ Seeti AI soch raha hai...";
  
  try{
    const res = await puter.ai.chat(q, {model: "claude-sonnet-4"});
    let full = "";
    // support both streaming and non-streaming
    if(typeof res[Symbol.asyncIterator] === 'function'){
      for await (const part of res){ if(part?.text){ full+=part.text; document.getElementById('aiResponse').textContent = full; } }
    } else {
      full = res.toString(); document.getElementById('aiResponse').textContent = full;
    }
    lastAIResult = full;
  }catch(e){
    document.getElementById('aiResponse').textContent = "Puter fail, backup AI try kar raha hu...";
    try{
      let b = await fetch('https://text.pollinations.ai/'+encodeURIComponent(q)).then(r=>r.text());
      document.getElementById('aiResponse').textContent = b; lastAIResult = b;
    }catch(err){ document.getElementById('aiResponse').textContent = "Error: "+e.message; }
  }
}

function applyAICode(){
  if(!lastAIResult){ alert("Pehle AI se kuch generate karo"); return; }
  cm.setValue(lastAIResult);
  openAI();
}
</script>
</body>
  </html>
