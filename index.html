<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seeti Code Studio</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#0f0f14">
<script src="https://js.puter.com/v2/"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css">
<style>
:root{--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.18);--accent:#8b5cf6;--accent2:#06ffa5;--bg:#0f0f14}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;width:100vw;overflow:hidden;font-family:Inter,system-ui,monospace;background:radial-gradient(1200px 600px at 10% -10%,#7c3aed 0%,transparent 60%),radial-gradient(1000px 500px at 90% 10%,#06b6d4 0%,transparent 60%),var(--bg);color:#e8e8ef;display:flex;flex-direction:column}
#top{height:60px;z-index:10;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 10px;overflow-x:auto}
.logo{font-weight:900;font-size:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:6px;flex-shrink:0}
.glass-btn,.glass-select{background:var(--glass);border:1px solid var(--border);color:#fff;padding:7px 10px;border-radius:10px;font-size:11px;cursor:pointer;flex-shrink:0}
.glass-btn.active{background:linear-gradient(135deg,var(--accent),#5b21b6)}
#wrap{display:flex;flex:1;overflow:hidden;gap:10px;padding:10px}
.panel{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:18px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
#left{width:50%}#right{width:50%}#left.full{width:100%}#left.full-hide{display:none}#right.full{width:100%}#right.full-hide{display:none}
#tabs{display:flex;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 12px;font-size:11px;opacity:.6;cursor:pointer;border-right:1px solid var(--border);white-space:nowrap}
.tab.active{opacity:1;background:rgba(139,92,246,.18);color:var(--accent2);border-bottom:2px solid var(--accent2);font-weight:700}
#editor{flex:1;overflow:hidden;position:relative}.CodeMirror{height:100%!important;background:transparent!important;font-size:13.5px;line-height:1.65!important}.CodeMirror-scroll{overflow:auto!important}
#symbolBar{display:flex;gap:5px;padding:6px;background:rgba(0,0,0,.35);border-top:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.sym{padding:5px 9px;background:var(--glass);border:1px solid var(--border);border-radius:7px;color:#fff;font-size:11px;cursor:pointer}
#previewHead{height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);font-size:11px;flex-shrink:0}
#preview{flex:1;border:none;background:#fff;width:100%}
#console{height:130px;background:#0a0a0f;color:#0f0;font-family:monospace;font-size:11px;padding:8px;overflow:auto;border-top:1px solid var(--border);display:none;white-space:pre-wrap}
#console.show{display:block}
#history{position:fixed;left:12px;top:70px;bottom:12px;width:300px;z-index:20;background:rgba(18,18,28,.96);border:1px solid var(--border);border-radius:18px;transform:translateX(-115%);transition:.3s;padding:14px;overflow:auto}
#history.open{transform:translateX(0)}
.hist-item{padding:9px;border:1px solid var(--border);background:var(--glass);border-radius:10px;margin-bottom:7px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:99}
.modal-box{width:min(420px,93vw);background:#1e1e28;border:1px solid var(--border);border-radius:18px;padding:16px;max-height:82vh;overflow:auto}
.opt{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between}
.opt:hover{background:rgba(255,255,255,.08)}
.badge{font-size:10px;padding:2px 6px;border-radius:99px;background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.3)}
@media(max-width:900px){#wrap{flex-direction:column}#left,#right{width:100%;height:50%}#top{height:56px}}
</style>
</head>
<body>
<div id="top">
<div class="logo"><img src="./icon.svg" width="26" height="26" style="border-radius:6px"> SEETI</div>
<button class="glass-btn" onclick="toggleHistory()">☰</button>
<button id="installBtn" class="glass-btn" onclick="installPWA()" style="display:none;background:linear-gradient(135deg,#8b5cf6,#06ffa5);color:#000;font-weight:900">📲 Install App</button>
<button id="updateBtn" class="glass-btn" onclick="updatePWA()" style="display:none;background:#06ffa5;color:#000;font-weight:800">⬇️ Update App</button>
<button class="glass-btn" onclick="openLangModal()">🌐 <span id="curLangTop">HTML</span> ▼</button>
<select id="project" class="glass-select" onchange="loadProject()"></select>
<button class="glass-btn" onclick="newProject()">+ New</button>
<button class="glass-btn" onclick="toggleSymbolBar()">{ }</button>
<button class="glass-btn" onclick="openGuide()">?</button>
<button class="glass-btn" onclick="openTools()">🛠</button>
<button id="btnSize" class="glass-btn" onclick="toggleSize()">⛶</button>
<button class="glass-btn" onclick="copyCode()" id="copyBtn">⎘</button>
<button class="glass-btn active" id="runBtn" onclick="runPreview()">▶ Run HTML</button>
</div>

<div id="wrap">
<div id="left" class="panel"><div id="tabs"></div><div id="editor"></div>
<div id="symbolBar">
<button class="sym" onclick="ins('{}',1)">{ }</button>
<button class="sym" onclick="ins('()',1)">( )</button>
<button class="sym" onclick="ins('[]',1)">[ ]</button>
<button class="sym" onclick="ins('<>',1)">< ></button>
<button class="sym" onclick="ins('\"\"',1)">"</button>
<button class="sym" onclick="ins('\'\'',1)">' </button>
<button class="sym" onclick="ins(':')">:</button>
<button class="sym" onclick="ins(';')">;</button>
<button class="sym" onclick="ins('=')">=</button>
<button class="sym" onclick="ins('/')">/</button>
</div>
</div>
<div id="right" class="panel"><div id="previewHead"><span id="langBadge">HTML • Desktop</span><div style="display:flex;gap:5px"><button class="glass-btn" style="padding:2px 7px" onclick="toggleConsole()">Console</button><button class="glass-btn" style="padding:2px 7px" onclick="toggleSize()">Full</button></div></div><iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe><div id="console"></div></div>
</div>

<div id="history"><h3>📁 Projects</h3><div id="histList" style="margin-top:10px"></div><button class="glass-btn" style="width:100%;margin-top:10px" onclick="toggleHistory()">Close</button></div>
<div class="modal" id="langModal"><div class="modal-box"><h3>Select Language</h3><div id="langOpts" style="margin-top:10px"></div><button class="glass-btn" style="margin-top:12px;width:100%" onclick="closeLang()">Close</button></div></div>
<div class="modal" id="guideModal"><div class="modal-box"><h3>📘 Guide & Errors</h3><div style="font-size:12px;line-height:1.6;margin-top:10px">
<b>HTML:</b> close tags check<br><b>CSS:</b> ; missing = red line<br><b>JS:</b> use console.log()<br><b>Python:</b> 4 spaces indent<br><b>C/C++:</b> #include + ; needed<br><b>Bash:</b> start with #!/bin/bash<br><b>PHP:</b> <?php...?><br><br>Red line = syntax error.
</div><button class="glass-btn" style="width:100%;margin-top:10px" onclick="document.getElementById('guideModal').style.display='none'">OK</button></div></div>
<div class="modal" id="toolsModal"><div class="modal-box"><h3>🛠 Tools</h3><div style="display:grid;gap:8px;margin-top:12px">
<button class="glass-btn" onclick="beautify()">✨ Beautify</button>
<button class="glass-btn" onclick="minify()">📦 Minify</button>
<button class="glass-btn" onclick="kitAI()">〰️ Kit AI Fix</button>
<div style="font-size:10px;opacity:.5">Size: ~18KB | Offline ready</div>
</div><button class="glass-btn" style="width:100%;margin-top:10px" onclick="document.getElementById('toolsModal').style.display='none'">Close</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/shell/shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/php/php.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.js"></script>

<script>
let deferredPrompt=null,swReg=null;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(r=>{
    swReg=r;
    r.addEventListener('updatefound',()=>{
      let btn=document.getElementById('updateBtn');
      btn.style.display='inline-flex';
      btn.innerHTML='⬇️ Update App';
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(!window.matchMedia('(display-mode: standalone)').matches){
    let b=document.getElementById('installBtn');
    b.style.display='inline-flex';b.innerHTML='📲 Install App';
  }
});
async function installPWA(){
  if(!deferredPrompt){alert('Browser menu ⋮ > Install App / Add to Home Screen');return;}
  deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;
  document.getElementById('installBtn').style.display='none';
}
function updatePWA(){if(swReg&&swReg.waiting)swReg.waiting.postMessage({type:'SKIP_WAITING'});else location.reload();}

const BOILERS={
 html:`<div class="hero">\n <h1>Seeti 💨</h1>\n <p>Fast • Glass • Code</p>\n <button onclick="whistle()">Press</button>\n</div>`,
 css:`body{height:100vh;display:grid;place-items:center;background:#0f0f14;color:#fff}\n.hero{text-align:center}\nh1{font-size:42px;background:linear-gradient(90deg,#8b5cf6,#06ffa5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}`,
 js:`function whistle(){console.log("Seeti!")}`,
 python:`print("Hello Seeti Python")\nfor i in range(5):\n print(f"Count {i}")`,
 c:`#include <stdio.h>\nint main(){\n printf("Hello C\\n");\n return 0;\n}`,
 cpp:`#include <bits/stdc++.h>\nusing namespace std;\nint main(){cout<<"Hello C++";return 0;}`,
 bash:`#!/bin/bash\necho "Seeti Bash"\nfor i in {1..5};do echo "Line $i";done`,
 php:`<?php echo "Hello PHP";?>`
};
const langConfig={
 html:{mode:'htmlmixed',badge:'HTML',run:'▶ Run HTML',type:'web'},
 css:{mode:'css',badge:'CSS',run:'▶ Run CSS',type:'web'},
 js:{mode:'javascript',badge:'JS',run:'▶ Run JS',type:'web'},
 python:{mode:'python',badge:'Python',run:'▶ Run Python',type:'code'},
 c:{mode:'text/x-csrc',badge:'C',run:'▶ Run C',type:'code'},
 cpp:{mode:'text/x-c++src',badge:'C++',run:'▶ Run C++',type:'code'},
 bash:{mode:'shell',badge:'Bash',run:'▶ Run Bash',type:'code'},
 php:{mode:'text/x-php',badge:'PHP',run:'▶ Run PHP',type:'code'}
};
let DB=JSON.parse(localStorage.getItem('seeti_final')||`{"projects":{"Welcome":{"parts":${JSON.stringify(BOILERS)},"time":${Date.now()}}},"current":"Welcome"}`);
function saveDB(){localStorage.setItem('seeti_final',JSON.stringify(DB));renderAll();}
let active='html';
let cm=CodeMirror(document.getElementById('editor'),{value:DB.projects[DB.current].parts[active],mode:langConfig[active].mode,theme:'material-darker',lineNumbers:true,lineWrapping:false,autoCloseBrackets:true,indentUnit:2});
cm.on('change',()=>{DB.projects[DB.current].parts[active]=cm.getValue();DB.projects[DB.current].time=Date.now();saveDB();if(langConfig[active].type==='web')autoRun();});
function ins(t,m){let c=cm.getCursor();cm.replaceRange(t,c);if(m)cm.setCursor({line:c.line,ch:c.ch+1});cm.focus();}
let symShow=true;function toggleSymbolBar(){symShow=!symShow;document.getElementById('symbolBar').style.display=symShow?'flex':'none';setTimeout(()=>cm.refresh(),100);}
let sizeMode='normal';function toggleSize(){let L=document.getElementById('left'),R=document.getElementById('right'),B=document.getElementById('btnSize');if(sizeMode==='normal'){sizeMode='code';L.className='panel full';R.className='panel full-hide';B.textContent='👁';}else if(sizeMode==='code'){sizeMode='preview';L.className='panel full-hide';R.className='panel full';B.textContent='📝';}else{sizeMode='normal';L.className='panel';R.className='panel';B.textContent='⛶';}setTimeout(()=>cm.refresh(),150);}
function toggleConsole(){document.getElementById('console').classList.toggle('show');}
function autoRun(){let p=DB.projects[DB.current].parts;document.getElementById('preview').style.display='block';document.getElementById('console').classList.remove('show');document.getElementById('preview').srcdoc=`${p.html||''}<style>${p.css||''}</style><script>window.onerror=function(m,s,l){parent.postMessage({type:'err',msg:m},'*')};${p.js||''}<\/script>`;}
window.addEventListener('message',e=>{if(e.data.type==='err'){let c=document.getElementById('console');c.classList.add('show');c.textContent+='❌ '+e.data.msg+'\n';}});
async function runPreview(){let cfg=langConfig[active];document.getElementById('runBtn').textContent=cfg.run;document.getElementById('curLangTop').textContent=cfg.badge;document.getElementById('langBadge').textContent=cfg.badge+' • '+(innerWidth<900?'Mobile':'Desktop');if(cfg.type==='web'){autoRun();return;}let con=document.getElementById('console');document.getElementById('preview').style.display='none';con.classList.add('show');con.textContent=`▶ ${cfg.badge}\n${cm.getValue()}\n---Output---\n`;try{let r=await puter.ai.chat(`Run ${cfg.badge}:\n${cm.getValue().slice(0,2000)}`);con.textContent+=r.message?.content||r;}catch(e){con.textContent+=e.message;}}
function openLangModal(){let g=k=>`<div class="opt" onclick="switchLang('${k}')"><span>${langConfig[k].badge}</span><span class="badge">${k}</span></div>`;document.getElementById('langOpts').innerHTML='<div style="opacity:.5;font-size:11px">WEB</div>'+['html','css','js'].map(g).join('')+'<div style="opacity:.5;font-size:11px;margin-top:8px">CODE</div>'+['python','c','cpp','bash','php'].map(g).join('');document.getElementById('langModal').style.display='flex';}
function closeLang(){document.getElementById('langModal').style.display='none';}
function switchLang(k){DB.projects[DB.current].parts[active]=cm.getValue();active=k;closeLang();cm.setOption('mode',langConfig[k].mode);cm.setValue(DB.projects[DB.current].parts[k]||BOILERS[k]||'');document.getElementById('runBtn').textContent=langConfig[k].run;document.getElementById('curLangTop').textContent=langConfig[k].badge;buildTabs();cm.refresh();runPreview();saveDB();}
function buildTabs(){document.getElementById('tabs').innerHTML=Object.keys(langConfig).map(k=>`<div class="tab ${k===active?'active':''}" onclick="switchLang('${k}')">${langConfig[k].badge}</div>`).join('');}
function newProject(){let n=prompt("Name?","Seeti "+(Object.keys(DB.projects).length+1));if(!n)return;DB.projects[n]={parts:{...BOILERS},time:Date.now()};DB.current=n;switchLang('html');saveDB();}
function loadProject(){DB.current=document.getElementById('project').value;switchLang('html');}
function renderAll(){let s=document.getElementById('project');s.innerHTML=Object.keys(DB.projects).map(k=>`<option ${k===DB.current?'selected':''}>${k}</option>`).join('');let arr=Object.entries(DB.projects).sort((a,b)=>b[1].time-a[1].time);document.getElementById('histList').innerHTML=arr.map(([k,v])=>`<div class="hist-item" onclick="openHist('${k}')"><b>${k}</b><br><small>${new Date(v.time).toLocaleString()}</small></div>`).join('');}
function openHist(k){DB.current=k;toggleHistory();loadProject();}
function toggleHistory(){document.getElementById('history').classList.toggle('open');}
function copyCode(){navigator.clipboard.writeText(cm.getValue());}
function openGuide(){document.getElementById('guideModal').style.display='flex';}
function openTools(){document.getElementById('toolsModal').style.display='flex';}
function beautify(){cm.setValue(cm.getValue().replace(/;/g,';\n').replace(/{/g,'{\n').replace(/}/g,'\n}\n'));}
function minify(){cm.setValue(cm.getValue().replace(/\s+/g,' ').trim());}
async function kitAI(){let q=prompt('Fix what?');if(!q)return;try{let r=await puter.ai.chat(q+':\n'+cm.getValue().slice(0,2000));let t=r.message?.content||r;if(confirm(t.slice(0,200)+'\n\nApply?'))cm.setValue(t);}catch(e){alert(e.message)}}
buildTabs();renderAll();switchLang('html');
</script>
</body>
</html>
